; ESP32-S3 PS5 AutoStore (SoftAP SSID AutoStore) - DevKitC-1 N16R8
; Build:   pio run
; FS image: pio run -t buildfs
; Flash (when chip in hand): pio run -t upload && pio run -t uploadfs

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Override stock DevKitC-1-N8 defaults -> N16R8
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DAUTOSTORE_VERSION=\"1.0.1\"

; USB device = TinyUSB HID keyboard (keyboard HID only; no gamepad spoof). CDC for Serial monitor.

; ESP32-S2 Mini (Wemos/Lolin, 4MB flash, 2MB PSRAM). Native USB OTG only, so
; TinyUSB runs in OTG mode (USB_MODE=0); no USB CDC so the console sees a plain keyboard.
[env:esp32-s2-mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions_4MB.csv
board_build.filesystem = littlefs
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DAUTOSTORE_VERSION=\"1.0.1\"
